# Source of truth for the Xcode project. Edit this file, then run `xcodegen`
# in ios/ to regenerate ikut.xcodeproj. Don't change build settings in Xcode.
name: ikut

options:
  bundleIdPrefix: dev.aqlan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 13.0.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Personal (free) team; switch to the paid team ID once enrollment (S1) is approved.
    DEVELOPMENT_TEAM: Y67R3NPM7F
    IKUT_EMULATOR_HOST: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ikut:
    type: application
    platform: iOS
    sources:
      - path: ikut
    info:
      path: ikut/Info.plist
      properties:
        CFBundleDisplayName: ikut
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: ikut shows your car to the others in your trip while the trip is active.
        NSLocationAlwaysAndWhenInUseUsageDescription: ikut keeps sharing your car’s location with your trip while the screen is off or you’re using another app. Sharing stops when the trip ends.
        # Debug-only: lets a phone reach the emulators on the Mac. Empty in normal builds.
        # NSLocalNetworkUsageDescription and NSAllowsLocalNetworking are for the emulators too: the
        # "Strip local-network keys" phase below removes them from the built Info.plist in Release.
        IKUTEmulatorHost: $(IKUT_EMULATOR_HOST)
        NSLocalNetworkUsageDescription: ikut connects to a development server on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [location]
        NSCameraUsageDescription: ikut uses the camera to scan a trip’s QR code.
        CFBundleURLTypes:
          - CFBundleURLName: dev.aqlan.ikut
            CFBundleURLSchemes: [ikut]
        NSLocationTemporaryUsageDescriptionDictionary:
          ConvoyTracking: Your exact location lets the others in your trip see where your car is.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aqlan.ikut
        ASSETCATALOG_COMPILER_APPICON_NAME: ikut
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # String Catalog: a build extracts SwiftUI literals into ikut/Localizable.xcstrings.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS_ALLOW_IN_DEBUG: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    postBuildScripts:
      - name: Strip local-network keys (Release)
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" != "Debug" ]; then
            PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
            /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$PLIST" || true
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity:NSAllowsLocalNetworking" "$PLIST" || true
          fi
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions

  ikutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ikutTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aqlan.ikutTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ikut

  ikutUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ikutUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aqlan.ikutUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ikut
    dependencies:
      - target: ikut

schemes:
  ikut:
    build:
      targets:
        ikut: all
        ikutTests: [test]
        ikutUITests: [test]
    test:
      targets:
        - ikutTests
        - ikutUITests
  # For device installs (field tests, battery runs): Release always talks to production,
  # so the app works when launched from the home screen.
  ikut-release:
    build:
      targets:
        ikut: all
    run:
      config: Release
    archive:
      config: Release
