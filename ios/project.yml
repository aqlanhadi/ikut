# Source of truth for the Xcode project. Edit this file, then run `xcodegen`
# in ios/ to regenerate ikut.xcodeproj. Don't change build settings in Xcode.
name: ikut

options:
  bundleIdPrefix: dev.aqlan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 13.0.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Personal (free) team; switch to the paid team ID once enrollment (S1) is approved.
    DEVELOPMENT_TEAM: Y67R3NPM7F
    IKUT_EMULATOR_HOST: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ikut:
    type: application
    platform: iOS
    sources:
      - path: ikut
    info:
      path: ikut/Info.plist
      properties:
        CFBundleDisplayName: ikut
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: ikut shows your car to the others in your trip while the trip is active.
        NSLocationAlwaysAndWhenInUseUsageDescription: ikut keeps sharing your car's position with your trip while the screen is off or you're using another app. Sharing stops when the trip ends.
        # Debug-only: lets a phone reach the emulators on the Mac. Empty in normal builds.
        IKUTEmulatorHost: $(IKUT_EMULATOR_HOST)
        NSLocalNetworkUsageDescription: ikut connects to a development server on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [location]
        NSLocationTemporaryUsageDescriptionDictionary:
          ConvoyTracking: Your exact position lets the others in your trip see where your car is.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aqlan.ikut
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions

  ikutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ikutTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aqlan.ikutTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ikut

  ikutUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ikutUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aqlan.ikutUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ikut
    dependencies:
      - target: ikut

schemes:
  ikut:
    build:
      targets:
        ikut: all
        ikutTests: [test]
        ikutUITests: [test]
    test:
      targets:
        - ikutTests
        - ikutUITests
