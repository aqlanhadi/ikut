# Source of truth for the Xcode project. Edit this file, then run `xcodegen`
# in ios/ to regenerate ikut.xcodeproj. Don't change build settings in Xcode.
name: ikut

options:
  bundleIdPrefix: dev.aqlan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 13.0.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ikut:
    type: application
    platform: iOS
    sources:
      - path: ikut
    info:
      path: ikut/Info.plist
      properties:
        CFBundleDisplayName: ikut
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aqlan.ikut
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore

  ikutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ikutTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aqlan.ikutTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ikut

schemes:
  ikut:
    build:
      targets:
        ikut: all
        ikutTests: [test]
    test:
      targets:
        - ikutTests
