<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ikut demos</title>
<style>
:root { --bg:#f6f6f4; --card:#fff; --fg:#1b1b1a; --dim:#6b6b66; --line:#dcdcd6; --accent:#0a6cff; --accent-fg:#fff;
  --ok:#0f7b3f; --okbg:#dcf3e4; --bad:#b3261e; --badbg:#fbe0dd; --warn:#8a5a00; --warnbg:#fdf0cf; --watch:#fff3c4; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#141413; --card:#1e1e1c; --fg:#ecece8; --dim:#9a9a92; --line:#3a3a36; --accent:#4d90ff; --accent-fg:#06142b;
    --ok:#6fd49a; --okbg:#143323; --bad:#ff948b; --badbg:#3d1815; --warn:#f0c26a; --warnbg:#3a2e10; --watch:#4a3f12; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
main { max-width:960px; margin:0 auto; padding:16px; }
h1 { font-size:1.4rem; margin:0 0 12px; } h2 { font-size:1.1rem; margin:0 0 4px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
.dim { color:var(--dim); } .small { font-size:.85rem; }
button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; padding:8px 14px; cursor:pointer; }
button.primary { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); font-weight:600; }
button.danger { background:var(--bad); color:var(--card); border-color:var(--bad); font-weight:600; }
button:disabled { opacity:.45; cursor:not-allowed; }
label { margin-right:14px; white-space:nowrap; }
.row { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
.pill { display:inline-block; padding:2px 12px; border-radius:999px; font-weight:600; background:var(--line); }
.pill.running { background:var(--okbg); color:var(--ok); } .pill.ended { background:var(--okbg); color:var(--ok); }
.pill.failed { background:var(--badbg); color:var(--bad); } .pill.joining,.pill.waiting,.pill.building { background:var(--warnbg); color:var(--warn); }
.banner { background:var(--warnbg); color:var(--warn); border:1px solid var(--warn); border-radius:10px; padding:10px 14px; margin-bottom:12px; font-weight:600; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.seg button { border:0; border-radius:0; } .seg button.on { background:var(--accent); color:var(--accent-fg); font-weight:600; }
.seg button.on.prod { background:var(--bad); color:var(--card); }
.code { font:700 3rem/1.1 ui-monospace,Menlo,monospace; letter-spacing:.15em; }
.bar { height:10px; border-radius:5px; background:var(--line); overflow:hidden; margin:6px 0; } .bar i { display:block; height:100%; background:var(--accent); }
ul.tl { list-style:none; margin:8px 0 0; padding:0; }
.tl li { display:flex; gap:10px; padding:6px 8px; border-radius:8px; opacity:.55; }
.tl li.done { opacity:1; } .tl li.watch.done { background:var(--watch); } .tl li.next { opacity:1; outline:2px solid var(--accent); }
.tl .at { font-family:ui-monospace,Menlo,monospace; min-width:3.6em; } .tl .cue { font-weight:700; }
.checks { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; }
.checks li { list-style:none; } .checks ul { padding:0; margin:4px 0 0; }
.pass { color:var(--ok); font-weight:600; } .fail { color:var(--bad); font-weight:600; }
.err { background:var(--badbg); color:var(--bad); padding:8px 12px; border-radius:8px; margin:8px 0; }
pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; max-height:320px; overflow:auto; font-size:.8rem; white-space:pre-wrap; word-break:break-all; }

.pg h2 { font-size:1.25rem; } .pg .lead { font-size:1.05rem; }
.pg input[type=number], .pg input[type=text], .pg select { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
.pg input[type=number] { width:5.5em; } .pg input.wide { width:14em; }
.pg .code { font-size:4rem; }
.pg .steps { margin:6px 0 10px; padding-left:1.2em; } .pg .steps li { margin:2px 0; }
.strip { position:relative; height:118px; margin:10px 8px 6px; }
.strip .road { position:absolute; left:0; right:0; top:50px; height:6px; border-radius:3px; background:var(--line); }
.strip .ends { position:absolute; top:104px; font-size:.8rem; color:var(--dim); } .strip .ends.r { right:0; }
.strip .dot { position:absolute; top:40px; width:26px; height:26px; margin-left:-13px; border-radius:50%; color:#fff; font-weight:700; font-size:.85rem; display:flex; align-items:center; justify-content:center; border:2px solid var(--card); box-shadow:0 0 0 1px var(--dim); }
.strip .dot.phone { box-shadow:0 0 0 3px var(--fg); } .strip .dot.joining { top:8px; border:2px dashed #fff; opacity:.85; }
.strip .name { position:absolute; font-size:.75rem; white-space:nowrap; transform:translateX(-50%); }
.strip .ev { position:absolute; top:58px; transform:translateX(-50%); font-size:.85rem; line-height:1; } .strip .ev.done { opacity:.35; }
.strip .ev.haz { color:var(--warn); } .strip .ev.stp { color:var(--accent); }
.carrow { border-top:1px solid var(--line); padding:10px 0; }
.carrow .nm { display:inline-flex; align-items:center; gap:8px; min-width:11em; font-weight:600; }
.carrow .sw { width:14px; height:14px; border-radius:50%; display:inline-block; }
.carrow .grid { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin-top:6px; }
.carrow .sees { margin-top:4px; } .sees.warn { color:var(--warn); font-weight:600; } .sees.bad { color:var(--bad); font-weight:600; }
.feed { list-style:none; margin:6px 0 0; padding:0; max-height:260px; overflow:auto; } .feed li { padding:5px 0; border-top:1px solid var(--line); }
.tag { display:inline-block; font-size:.75rem; border-radius:999px; padding:1px 8px; background:var(--line); margin-left:4px; }
.tag.joining { background:var(--warnbg); color:var(--warn); } .tag.convoy { background:var(--okbg); color:var(--ok); } .tag.off { background:var(--badbg); color:var(--bad); }
.hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>ikut live demos</h1>
  <div id="notice" class="err hidden"></div>

  <section id="pg" class="card pg"></section>
  <h2 style="margin:18px 0 8px">Scripted demos</h2>
  <section id="runView" class="card hidden"></section>

  <div class="row" style="margin-bottom:12px">
    <span>Run on</span>
    <span class="seg" id="backendSwitch"></span>
    <button id="refresh" class="small">Look for demos again</button>
  </div>
  <div id="prodBanner" class="banner hidden">Runs on the real Firebase project: creates a real trip and anonymous users; the trip is ended at the end.</div>
  <div id="list"></div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mmss = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

let demos = [], backends = {}, backend = store.get('ikut-backend') === 'production' ? 'production' : 'emulators';
let run = null, events = [], log = [], confirming = null, logOpen = false;
const opts = {}; // per demo file: { skipBuild, endTrip }
const running = () => run?.status === 'running';

// ---- run state, derived from the events
function derive() {
  const d = { phase: null, detail: '', code: null, tick: null, backend: null, errors: [], checks: {}, seen: [] };
  for (const e of events) {
    if (e.type === 'phase') { d.phase = e.phase; d.detail = e.detail || ''; }
    else if (e.type === 'code') d.code = e.code;
    else if (e.type === 'tick') d.tick = e;
    else if (e.type === 'backend') d.backend = e;
    else if (e.type === 'error') d.errors.push(e.message);
    else if (e.type === 'check') (d.checks[e.phone] ??= []).push(e);
    else if (e.type === 'event') d.seen.push(e);
  }
  return d;
}
function elapsed(d) {
  if (!d.tick) return 0;
  const over = running() && d.phase === 'running' ? (Date.now() - d.tick.ts) / 1000 : 0;
  return d.tick.t + Math.min(over, 5);
}

// ---- rendering
function renderBackend() {
  $('#backendSwitch').innerHTML = ['emulators', 'production'].map((b) =>
    `<button data-b="${b}" class="${b === backend ? 'on' : ''} ${b === 'production' ? 'prod' : ''}" ${running() ? 'disabled' : ''}>${b === 'emulators' ? 'Emulators' : 'Production'}</button>`).join('');
  $('#prodBanner').classList.toggle('hidden', backend !== 'production');
}
function renderList() {
  $('#list').innerHTML = demos.filter((d) => !d.interactive).map((d) => {
    const o = opts[d.file] ??= { skipBuild: false, endTrip: false };
    const emuDown = backend === 'emulators' && backends.emulators && !backends.emulators.up;
    const prod = backend === 'production';
    const label = confirming === d.file ? 'Are you sure?' : prod ? 'Play on production' : 'Play';
    return `<div class="card" data-f="${esc(d.file)}">
      <div class="row" style="justify-content:space-between"><h2>${esc(d.title)}</h2>
        <span class="dim small">${d.durationSeconds ? 'about ' + mmss(d.durationSeconds) + ' min' : esc(d.file)}</span></div>
      <p>${esc(d.summary)}</p>
      ${d.phones?.length ? `<p class="small"><b>Phones:</b> ${d.phones.map((p) => `${esc(p.label)} (${esc(p.role)})`).join(', ')}</p>` : ''}
      ${d.cast?.length ? `<p class="small"><b>Cast:</b> ${d.cast.map((c) => `${esc(c.name)} (${esc(c.role)})`).join(', ')}</p>` : ''}
      ${emuDown ? `<div class="err small">${esc(backends.emulators.hint)}</div>` : ''}
      ${prod && backends.production?.project ? `<p class="small dim">Production project: ${esc(backends.production.project)}</p>` : ''}
      <div class="row">
        <label><input type="checkbox" data-o="skipBuild" ${o.skipBuild ? 'checked' : ''}> Skip the build</label>
        <label><input type="checkbox" data-o="endTrip" ${o.endTrip || prod ? 'checked' : ''} ${prod ? 'disabled' : ''}> End the trip at the end</label>
        <button data-play class="${prod || confirming === d.file ? 'danger' : 'primary'}" ${running() ? 'disabled' : ''}>${label}</button>
        ${confirming === d.file ? '<button data-cancel>Cancel</button>' : ''}
      </div></div>`;
  }).join('') || '<p class="dim">No demos found.</p>';
}
function renderRun() {
  const el = $('#runView');
  if (!run || run.interactive) return el.classList.add('hidden');
  el.classList.remove('hidden');
  const d = derive(), t = elapsed(d), dur = run.durationSeconds || 0;
  const done = new Set();
  const used = new Set();
  run.timeline.forEach((e, i) => { const j = d.seen.findIndex((s, k) => !used.has(k) && (s.text === e.text || s.at === e.at)); if (j >= 0) { used.add(j); done.add(i); } });
  const next = running() ? run.timeline.findIndex((_, i) => !done.has(i)) : -1;
  const asked = run.options?.backend || 'emulators';
  const be = d.backend?.backend || asked;
  const names = Object.keys(d.checks).sort();
  el.innerHTML = `
    <div class="row" style="justify-content:space-between">
      <div><h2>${esc(run.title)}</h2>
        <span class="pill ${esc(d.phase)}">${esc(d.phase || 'starting')}</span> <span class="dim">${esc(d.detail)}</span>
        <span class="pill" style="${be === 'production' ? 'background:var(--badbg);color:var(--bad)' : ''}">${be === 'production' ? 'Production' : 'Emulators'}${d.backend?.project ? ' · ' + esc(d.backend.project) : ''}</span></div>
      <button class="danger" data-stop ${running() && !run.stopping ? '' : 'disabled'}>${run.stopping && running() ? 'Stopping…' : 'Stop'}</button>
    </div>
    ${d.code ? `<div><span class="dim small">Trip code</span><div class="code">${esc(d.code)}</div></div>` : ''}
    ${d.errors.map((m) => `<div class="err">${esc(m)}</div>`).join('')}
    ${dur ? `<div class="row"><b>T+${mmss(t)}</b><span class="dim">of ${mmss(dur)}</span></div><div class="bar"><i style="width:${Math.min(100, t / dur * 100)}%"></i></div>` : ''}
    <ul class="tl">${run.timeline.map((e, i) => {
      const left = Math.max(0, Math.round(e.at - t));
      return `<li class="${done.has(i) ? 'done' : ''} ${e.watch ? 'watch' : ''} ${i === next ? 'next' : ''}">
        <span class="at">${mmss(e.at)}</span><span>${e.watch ? `<span class="cue">Watch${e.who && e.who !== 'script' ? ' ' + esc(e.who) : ''}:</span> ` : ''}${esc(e.text)}</span>
        ${i === next && d.phase === 'running' ? `<span class="dim" style="margin-left:auto">in ${left}s</span>` : ''}</li>`;
    }).join('')}</ul>
    ${names.length ? `<div class="checks" style="margin-top:12px">${names.map((n) => `<div><b>Phone ${esc(n)}</b><ul>${d.checks[n].map((c) =>
      `<li><span class="${c.status === 'PASS' ? 'pass' : 'fail'}">${c.status === 'PASS' ? 'PASS' : 'FAIL'}</span> ${esc(c.name)}</li>`).join('')}</ul></div>`).join('')}</div>` : ''}
    <details style="margin-top:12px" ${logOpen ? 'open' : ''}><summary>Log (last ${log.length} lines)</summary><pre id="logbox">${esc(log.join('\n'))}</pre></details>`;
  const lb = $('#logbox'); if (lb) lb.scrollTop = lb.scrollHeight;
  $('#runView details').ontoggle = (e) => { logOpen = e.target.open; };
}
const renderAll = () => { renderBackend(); renderList(); renderRun(); renderPg(); };

// ---- actions
async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const j = await r.json().catch(() => ({}));
  $('#notice').classList.toggle('hidden', r.ok);
  if (!r.ok) $('#notice').textContent = j.error || 'Something went wrong.';
  return r.ok;
}
async function loadDemos(refresh) {
  const j = await (await fetch('/api/demos' + (refresh ? '?refresh=1' : ''))).json();
  demos = j.demos; backends = j.backends; renderAll();
}
document.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.id === 'refresh') return loadDemos(true);
  if (b.dataset.b) { backend = b.dataset.b; store.set('ikut-backend', backend); confirming = null; return renderAll(); }
  if (b.dataset.stop !== undefined) return post('/api/stop');
  if (b.dataset.cancel !== undefined) { confirming = null; return renderList(); }
  if (b.dataset.play !== undefined) {
    const file = b.closest('[data-f]').dataset.f, o = opts[file];
    if (backend === 'production' && confirming !== file) { confirming = file; return renderList(); }
    confirming = null;
    post('/api/start', { file, backend, skipBuild: o.skipBuild, endTrip: backend === 'production' || o.endTrip });
  }
});
document.addEventListener('change', (ev) => {
  const c = ev.target.closest('[data-o]'); if (c) opts[c.closest('[data-f]').dataset.f][c.dataset.o] = c.checked;
});


// ---- Playground
const CARCOLOR = { phone1: '#0a6cff', phone2: '#d9480f', daniel: '#7C3AED', hafiz: '#0F766E' };
const EVLABEL = { debris: 'Debris', accident: 'Accident', pothole: 'Pothole', animal: 'Animal on the road', stoppedVehicle: 'Stopped vehicle', roadworks: 'Roadworks', heavyRain: 'Heavy rain', trafficJam: 'Traffic jam',
  stopRest: 'Rest stop', stopFuel: 'Fuel stop', stopFood: 'Food stop', stopToilet: 'Toilet stop', pullingOver: 'Pulling over', carTrouble: 'Car trouble', runningLate: 'Running late', message: 'Message' };
let pg = null, pgForm = { startKind: 'default', startText: '', skipBuild: true, dd: '' }, carForm = {}, pendingPrepare = null;
const pgRun = () => (run?.interactive ? run : null);
const km1 = (m) => (m === null || m === undefined ? '–' : (m / 1000).toFixed(1) + ' km');
const secs = (s) => (s === null || s === undefined ? '' : s < 90 ? `${s} s ago` : `${Math.round(s / 60)} min ago`);
async function cmd(body) { return post('/api/command', body); }
function formFor(c) {
  return carForm[c.key] ??= { km: (c.joining && c.mergeKm !== null ? c.mergeKm : (pg?.defaults?.[c.key] ?? 0) / 1000).toFixed(1), speed: String(c.speed ?? 90), off: c.joining, side: String(c.sideMeters ?? 2000) };
}
let stripWhole = false;
function pgStrip(st) {
  const L = st.routeLength;
  const at = [...st.cars.filter((c) => c.joined || c.kind === 'generated').map((c) => c.offset), ...st.events.filter((e) => e.offset !== null).map((e) => e.offset)];
  let lo = 0, hi = L;
  if (!stripWhole && at.length) {
    lo = Math.max(0, Math.min(...at) - 1500); hi = Math.min(L, Math.max(...at) + 2500);
    if (hi - lo < 6000) { hi = Math.min(L, lo + 6000); lo = Math.max(0, hi - 6000); }
  }
  const pct = (m) => `${Math.max(0, Math.min(100, ((m - lo) / (hi - lo)) * 100))}%`;
  const inView = (m) => m >= lo - 1 && m <= hi + 1;
  const shown = st.cars.filter((c) => (c.joined || c.kind === 'generated') && inView(c.offset)).sort((a, b) => a.offset - b.offset);
  const dots = shown.map((c, i) => {
    const level = i % 3; // names go above or below the road, in three heights, so close cars do not hide each other
    const above = level === 1;
    const top = c.joining ? -4 : above ? 4 : level === 0 ? 74 : 92;
    return `<span class="dot ${c.kind} ${c.joining ? 'joining' : ''}" style="left:${pct(c.offset)};background:${CARCOLOR[c.key]}" title="${esc(c.label)}">${c.number ?? ''}</span>`
      + `<span class="name" style="left:${pct(c.offset)};top:${top}px;color:${CARCOLOR[c.key]}">${esc(c.label)}${c.joining ? ' (joining)' : ''}</span>`;
  }).join('');
  const evs = st.events.filter((e) => e.offset !== null && inView(e.offset)).map((e) => {
    const stop = e.category === 'stopRequest';
    const mark = e.pinned ? '■' : stop ? '●' : '▲';
    return `<span class="ev ${stop ? 'stp' : 'haz'} ${e.resolved ? 'done' : ''}" style="left:${pct(e.offset)}" title="${esc(EVLABEL[e.type] || e.type)} at ${km1(e.offset)}">${mark}</span>`;
  }).join('');
  return `<div class="strip"><div class="road"></div>${dots}${evs}<span class="ends">${stripWhole ? 'Start' : km1(lo)}</span><span class="ends r">${stripWhole ? esc(st.destination) + ' · ' : ''}${km1(hi)}</span></div>
    <div class="row small dim"><span>Numbers are the car numbers in the app. Ringed dots are the phones, dashed ones are still joining. ▲ hazard, ● stop request, ■ pinned stop.</span>
    <button data-pg="zoom" class="small">${stripWhole ? 'Zoom in on the cars' : 'Show the whole route'}</button></div>`;
}
function pgCar(c, st) {
  const f = formFor(c);
  const gen = c.kind === 'generated';
  let sees = '';
  if (!c.joined) sees = `<div class="sees dim small">${gen ? 'Joining…' : 'Not joined yet. Join on phone 2 with the code.'}</div>`;
  else if (!c.reported) sees = `<div class="sees warn small">The app has no position for this car yet.</div>`;
  else {
    const r = c.reported, stale = r.ageSeconds !== null && r.ageSeconds > 45;
    const off = !c.joining && r.offset !== null && Math.abs(r.offset - c.offset) > 500;
    sees = `<div class="sees small ${stale || off ? 'warn' : 'dim'}">The app has this car at ${km1(r.offset)}, ${esc(secs(r.ageSeconds))}${stale ? ' (stale: “Last seen” on the other phones)' : ''}${off ? `. It is not following: it should be at ${km1(c.offset)}.` : ''}</div>`;
  }
  const play = `<button data-pg="play" data-car="${c.key}" class="${c.playing ? '' : 'primary'}">${c.playing ? 'Pause' : 'Play'}</button>`;
  return `<div class="carrow"><div class="row" style="justify-content:space-between">
    <span class="nm"><span class="sw" style="background:${CARCOLOR[c.key]}"></span>${esc(c.label)}${c.name ? ` <span class="dim small" style="font-weight:400">${esc(c.name)}</span>` : ''}
      ${gen ? '' : '<span class="tag">phone ' + (c.key === 'phone1' ? '1' : '2') + '</span>'}${c.joining ? '<span class="tag joining">joining</span>' : c.joined ? '<span class="tag convoy">in the convoy</span>' : ''}
      ${c.offline ? '<span class="tag off">no signal</span>' : ''}</span>
    <span>Now at <b>${km1(c.offset)}</b>${c.joining ? ` · merges at ${c.mergeKm?.toFixed(1)} km` : ''} ${play}</span></div>
    <div class="grid">
      <label>${gen && f.off ? 'Merges at' : 'Place at'} <input type="number" step="0.1" min="0" id="km-${c.key}" data-f="km" data-car="${c.key}" value="${esc(f.km)}"> km</label>
      <label>Speed <input type="number" step="5" min="0" max="200" id="sp-${c.key}" data-f="speed" data-car="${c.key}" value="${esc(f.speed)}"> km/h</label>
      ${gen ? `<label><input type="checkbox" data-f="off" data-car="${c.key}" ${f.off ? 'checked' : ''}> Starts off the route</label>
        ${f.off ? `<label>Side road <input type="number" step="100" min="500" id="sd-${c.key}" data-f="side" data-car="${c.key}" value="${esc(f.side)}"> m away</label>` : ''}` : ''}
    </div>
    ${gen ? `<div class="grid"><label><input type="checkbox" data-b="agree" data-car="${c.key}" ${c.agree ? 'checked' : ''}> Agrees to stops</label>
      <label><input type="checkbox" data-b="suggest" data-car="${c.key}" ${c.suggest ? 'checked' : ''}> Suggests a place</label>
      <button data-pg="drop" data-car="${c.key}" class="${c.offline ? 'primary' : ''}">${c.offline ? 'Give signal back' : 'Drop signal'}</button></div>` : ''}
    ${sees}</div>`;
}
function pgEvents(st) {
  if (!st.events.length) return '<p class="dim small">Nothing reported yet. Tap Report or Pit stop on a phone.</p>';
  return `<ul class="feed">${st.events.map((e) => {
    const bits = [];
    if (e.category === 'stopRequest') {
      bits.push(`${e.agree} agree${e.disagree ? `, ${e.disagree} not now` : ''}`);
      if (e.suggestions.length) bits.push(`suggested: ${e.suggestions.map(esc).join(', ')}`);
      if (e.pinned) bits.push(`pinned: ${esc(e.pinned)}`);
      if (e.resolved) bits.push('everyone has arrived');
    } else if (e.resolved) bits.push('expired');
    return `<li><b>${esc(EVLABEL[e.type] || e.type)}</b> by ${esc(e.by || 'someone')} at ${km1(e.offset)} <span class="dim">${esc(secs(e.ageSeconds))}</span>${bits.length ? `<div class="small dim">${bits.join(' · ')}</div>` : ''}</li>`;
  }).join('')}</ul>`;
}
function renderPg() {
  const el = $('#pg');
  if (el.contains(document.activeElement) && document.activeElement.dataset.dirty) return; // don't pull a field from under someone typing
  const a = document.activeElement, keep = el.contains(a) && a.id ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null;
  const r = pgRun(), live = r && r.status === 'running', st = live ? pg : null;
  const other = running() && !live;
  let h = `<div class="row" style="justify-content:space-between"><div><h2>Playground</h2>
    <p class="lead dim" style="margin:0">Try one event at a time on the real app. You tap the phones; this places the cars and plays the route.</p></div>
    ${live ? `<button class="danger" data-pg="close" ${r.stopping ? 'disabled' : ''}>${r.stopping ? 'Closing…' : 'Close the playground'}</button>` : ''}</div>`;
  if (!live || !st || st.phase === 'setup') {
    const emuDown = backends.emulators && !backends.emulators.up;
    h += `<div class="row" style="margin-top:10px"><label>Everyone starts at
        <select id="startKind" data-pgf="startKind"><option value="default" ${pgForm.startKind === 'default' ? 'selected' : ''}>the E1 start used by the demos</option><option value="free" ${pgForm.startKind === 'free' ? 'selected' : ''}>somewhere else</option></select></label>
      ${pgForm.startKind === 'free' ? `<input type="text" class="wide" id="startText" data-pgf="startText" placeholder="3.45, 101.40" value="${esc(pgForm.startText)}">` : ''}
      <label><input type="checkbox" data-pgf="skipBuild" ${pgForm.skipBuild ? 'checked' : ''}> Skip the build</label>
      <label class="small dim">Build folder <input type="text" class="wide" id="ddText" data-pgf="dd" placeholder="/tmp/ikut-dd-q4 (default)" value="${esc(pgForm.dd)}"></label>
      <button class="primary" data-pg="prepare" ${other || pendingPrepare || (live && !st) ? 'disabled' : ''}>Prepare phones</button></div>
      <p class="small dim">Puts a fresh copy of the app on iPhone 17 #1 and #2, switches on location, parks both at the start and opens the app. Emulators only.</p>
      ${other ? '<div class="err small">A scripted demo is running. Stop it first.</div>' : ''}
      ${emuDown ? `<div class="err small">${esc(backends.emulators.hint)}</div>` : ''}
      ${st?.problem ? `<div class="err">${esc(st.problem)}</div>` : ''}
      ${r && !live ? '<p class="small dim">The playground is closed. The trip is still there; end it from the menu on phone 1.</p>' : ''}`;
  } else if (st.phase === 'preparing') {
    h += `<p class="lead"><span class="pill building">Preparing</span> ${esc(st.detail)}</p>`;
  } else if (st.phase === 'waiting') {
    h += `<p class="lead"><span class="pill waiting">Ready</span> <b>Create a trip on phone 1.</b></p>
      <ol class="steps"><li>On phone 1 tap New Trip, pick a destination (the route should be long enough for the cars, say Ipoh).</li><li>Come back here: the trip code shows up.</li></ol>
      ${st.problem ? `<div class="err">${esc(st.problem)}</div>` : ''}`;
  } else {
    const ready = st.phase === 'ready';
    h += `<div class="row" style="justify-content:space-between;align-items:flex-end"><div><span class="dim small">Trip code — join on phone 2 with this</span><div class="code">${esc(st.code)}</div>
      <span class="dim">to ${esc(st.destination || '…')} · ${km1(st.routeLength)}${ready ? '' : ' · ' + esc(st.detail)}</span></div>
      <div class="row"><button class="primary" data-pg="playAll" ${ready ? '' : 'disabled'}>Play all</button><button data-pg="pauseAll" ${ready ? '' : 'disabled'}>Pause all</button></div></div>`;
    if (st.problem) h += `<div class="err">${esc(st.problem)}</div>`;
    if (st.routeLength) h += pgStrip(st);
    h += st.cars.map((c) => pgCar(c, st)).join('');
    h += `<h2 style="margin-top:14px;font-size:1.05rem">What was reported</h2>${pgEvents(st)}`;
  }
  el.innerHTML = h;
  if (keep) { const n = document.getElementById(keep.id); if (n) { n.focus(); try { n.setSelectionRange(keep.s, keep.e); } catch {} } }
}
async function startPlayground() {
  const j = await fetch('/api/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ file: 'demo-playground.mjs', backend: 'emulators' }) });
  if (!j.ok) { $('#notice').classList.remove('hidden'); $('#notice').textContent = (await j.json().catch(() => ({}))).error || 'Could not open the playground.'; return false; }
  return true;
}
function prepareBody() {
  return { cmd: 'prepare', start: pgForm.startKind === 'free' ? pgForm.startText : 'default', skipBuild: pgForm.skipBuild, derivedData: pgForm.dd.trim() || undefined };
}
document.addEventListener('click', async (ev) => {
  const b = ev.target.closest('button[data-pg]'); if (!b) return;
  const k = b.dataset.car, c = pg?.cars?.find((x) => x.key === k), what = b.dataset.pg;
  if (what === 'prepare') {
    const body = prepareBody();
    if (pgRun()?.status === 'running' && pg) return cmd(body);
    pendingPrepare = body; renderPg();
    if (!(pgRun()?.status === 'running') && !(await startPlayground())) { pendingPrepare = null; renderPg(); }
  } else if (what === 'close') post('/api/stop');
  else if (what === 'playAll') cmd({ cmd: 'playAll', playing: true });
  else if (what === 'pauseAll') cmd({ cmd: 'playAll', playing: false });
  else if (what === 'play') cmd({ cmd: 'play', car: k, playing: !c.playing });
  else if (what === 'drop') cmd({ cmd: 'drop', car: k, offline: !c.offline });
});
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.dataset.f) { carForm[t.dataset.car] ??= {}; carForm[t.dataset.car][t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value; t.dataset.dirty = '1'; }
  if (t.dataset.pgf && t.type === 'text') { pgForm[t.dataset.pgf] = t.value; t.dataset.dirty = '1'; }
});
document.addEventListener('change', (ev) => {
  const t = ev.target; delete t.dataset.dirty;
  if (t.dataset.pgf) { pgForm[t.dataset.pgf] = t.type === 'checkbox' ? t.checked : t.value; return renderPg(); }
  if (t.dataset.b) return cmd({ cmd: 'behaviour', car: t.dataset.car, [t.dataset.b]: t.checked });
  if (!t.dataset.f) return;
  const k = t.dataset.car, f = carForm[k] ?? (carForm[k] = {});
  if (t.dataset.f === 'speed') return cmd({ cmd: 'speed', car: k, kmh: Number(t.value) });
  if (t.dataset.f === 'km' || t.dataset.f === 'side' || t.dataset.f === 'off') {
    const gen = k === 'daniel' || k === 'hafiz';
    cmd({ cmd: 'place', car: k, km: Number(f.km), offRoute: gen && Boolean(f.off), sideMeters: Number(f.side) });
    if (t.dataset.f === 'off') renderPg();
  }
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.matches('.pg input')) ev.target.blur(); });

// ---- live updates
function connect() {
  const es = new EventSource('/api/events');
  es.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.k === 'snapshot') { run = msg.run; events = msg.events; log = msg.log; pg = msg.state; confirming = null; }
    else if (msg.k === 'state') {
      pg = msg.state;
      if (pendingPrepare && pg.phase === 'setup') { const b = pendingPrepare; pendingPrepare = null; cmd(b); }
      return renderPg();
    }
    else if (msg.k === 'ev') events.push(msg.ev);
    else if (msg.k === 'log') { log.push(msg.line); if (log.length > 500) log.shift(); }
    else if (msg.k === 'run') { run = msg.run; if (run && run.status !== 'running') pendingPrepare = null; }
    if (msg.k === 'ev' || msg.k === 'log') renderRun(); else renderAll();
  };
}
setInterval(() => { if (running()) renderRun(); }, 1000);
loadDemos().then(connect);
</script>
