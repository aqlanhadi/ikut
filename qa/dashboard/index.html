<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ikut demos</title>
<style>
/* ikut's own look (ios/ikut/UI/Theme.swift, CarBadge.swift, TripComponents.swift): accent, positive and warning colours, grouped background with
   white cards, 24 pt cards, 14 pt controls, capsule buttons, rounded bold car badges. Light and dark follow the system. */
:root {
  --screen:#f2f2f7; --card:#fff; --tile:#f2f2f7; --label:#000; --secondary:#6c6c70; --sep:#c6c6c8;
  --accent:#0071e3; --accent-fg:#fff; --accent-soft:rgba(0,113,227,.12);
  --pos:#1f7a35; --pos-soft:rgba(31,122,53,.13); --warn:#c93400; --warn-soft:rgba(201,52,0,.12); --red:#ff3b30; --red-soft:rgba(255,59,48,.12);
  --shadow:0 6px 24px rgba(0,0,0,.14);
  --r-card:24px; --r-control:14px; --r-tile:22px;
  --badge-font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* names the scripted-demos tab still uses */
  --bg:var(--screen); --fg:var(--label); --dim:var(--secondary); --line:var(--sep); --ok:var(--pos); --okbg:var(--pos-soft); --bad:var(--red); --badbg:var(--red-soft); --warnbg:var(--warn-soft); --watch:rgba(255,204,0,.28);
}
@media (prefers-color-scheme: dark) {
  :root {
    --screen:#000; --card:#1c1c1e; --tile:#2c2c2e; --label:#fff; --secondary:#98989f; --sep:#38383a;
    --accent:#2997ff; --accent-fg:#001a33; --accent-soft:rgba(41,151,255,.18);
    --pos:#30d158; --pos-soft:rgba(48,209,88,.16); --warn:#ff9f0a; --warn-soft:rgba(255,159,10,.16); --red:#ff453a; --red-soft:rgba(255,69,58,.18);
    --shadow:0 6px 24px rgba(0,0,0,.6);
    --watch:rgba(255,214,10,.22);
  }
}
/* ?theme=light or ?theme=dark in the address forces one (for screenshots); without it the system decides */
:root[data-theme=dark] {
  color-scheme:dark;
    --screen:#000; --card:#1c1c1e; --tile:#2c2c2e; --label:#fff; --secondary:#98989f; --sep:#38383a;
    --accent:#2997ff; --accent-fg:#001a33; --accent-soft:rgba(41,151,255,.18);
    --pos:#30d158; --pos-soft:rgba(48,209,88,.16); --warn:#ff9f0a; --warn-soft:rgba(255,159,10,.16); --red:#ff453a; --red-soft:rgba(255,69,58,.18);
    --shadow:0 6px 24px rgba(0,0,0,.6);
    --watch:rgba(255,214,10,.22);
}
:root[data-theme=light] {
  color-scheme:light;
  --screen:#f2f2f7; --card:#fff; --tile:#f2f2f7; --label:#000; --secondary:#6c6c70; --sep:#c6c6c8;
  --accent:#0071e3; --accent-fg:#fff; --accent-soft:rgba(0,113,227,.12);
  --pos:#1f7a35; --pos-soft:rgba(31,122,53,.13); --warn:#c93400; --warn-soft:rgba(201,52,0,.12); --red:#ff3b30; --red-soft:rgba(255,59,48,.12);
  --shadow:0 6px 24px rgba(0,0,0,.14);
  --r-card:24px; --r-control:14px; --r-tile:22px;
  --badge-font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  --watch:rgba(255,204,0,.28);
}
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--screen); color:var(--label); font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
.hidden { display:none !important; }
.dim { color:var(--secondary); } .small { font-size:.85rem; }
h2 { font-size:1.1rem; margin:0 0 4px; }

/* buttons: capsules */
button { font:inherit; font-weight:600; border:0; background:var(--card); color:var(--accent); border-radius:999px; padding:7px 14px; cursor:pointer; box-shadow:inset 0 0 0 1px var(--sep); }
button:hover { filter:brightness(.97); }
button.primary { background:var(--accent); color:var(--accent-fg); box-shadow:none; }
button.danger { background:var(--red); color:#fff; box-shadow:none; }
button.quiet { box-shadow:none; background:transparent; padding:4px 8px; }
button.sm { padding:3px 10px; font-size:.82rem; }
button.on { background:var(--accent); color:var(--accent-fg); box-shadow:none; }
button:disabled { opacity:.4; cursor:not-allowed; }
input[type=number], input[type=text], select { font:inherit; font-size:.88rem; color:var(--label); background:var(--tile); border:0; border-radius:var(--r-control); padding:5px 10px; }
select { padding-right:6px; max-width:8.6em; cursor:pointer; font-weight:600; color:var(--accent); border-radius:999px; }
select#startKind { max-width:none; }
input[type=number] { width:4.6em; } input.wide { width:13em; }
label { white-space:nowrap; }
input[type=checkbox] { accent-color:var(--accent); }
.row { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; }
.pill { display:inline-flex; align-items:center; gap:6px; padding:3px 11px; border-radius:999px; font-weight:600; font-size:.82rem; background:var(--tile); }
.pill::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.9; }
.pill.running, .pill.ended, .pill.ok { background:var(--pos-soft); color:var(--pos); }
.pill.waiting, .pill.building, .pill.warn { background:var(--warn-soft); color:var(--warn); }
.pill.failed { background:var(--red-soft); color:var(--red); }
.cap { font-size:.78rem; text-transform:uppercase; letter-spacing:.03em; color:var(--secondary); }
.err { background:var(--red-soft); color:var(--red); padding:8px 12px; border-radius:var(--r-control); margin:8px 0; font-size:.9rem; }
.note { background:var(--warn-soft); color:var(--warn); padding:8px 12px; border-radius:var(--r-control); margin:8px 0; font-size:.88rem; }

/* top bar */
.top { display:flex; align-items:center; gap:16px; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--sep); flex:none; flex-wrap:wrap; }
.brand { font:800 1.25rem var(--badge-font); letter-spacing:-.01em; } .brand span { color:var(--accent); }
.tabs { display:inline-flex; background:var(--tile); border-radius:999px; padding:3px; }
.tabs button { box-shadow:none; background:transparent; color:var(--label); padding:5px 16px; }
.tabs button.on { background:var(--card); color:var(--label); box-shadow:0 1px 4px rgba(0,0,0,.18); }
.grow { flex:1; }
#notice { margin:0; border-radius:0; flex:none; }

/* playground: map left, panel right */
.split { flex:1; min-height:0; display:flex; }
.mapcol { position:relative; flex:1; min-width:0; background:var(--tile); }
#map { position:absolute; inset:0; }
#plain { position:absolute; inset:0; overflow:auto; padding:16px; }
#panel { width:410px; flex:none; overflow-y:auto; padding:12px; background:var(--screen); border-left:1px solid var(--sep); display:flex; flex-direction:column; gap:12px; }
@media (max-width: 860px) {
  .split { flex-direction:column; overflow-y:auto; }
  .mapcol { flex:none; height:58vh; min-height:340px; }
  #panel { width:auto; overflow:visible; border-left:0; border-top:1px solid var(--sep); }
}
.card { background:var(--card); border-radius:var(--r-card); padding:14px; }
.card.flat { border-radius:var(--r-tile); }
.code { font:800 2.6rem/1.05 var(--badge-font); letter-spacing:.16em; }

/* over the map */
.maptools { position:absolute; top:12px; right:12px; display:flex; gap:6px; z-index:5; }
.maptools button { box-shadow:var(--shadow); }
.maptools button.on { background:var(--accent); color:var(--accent-fg); }
.hint { position:absolute; left:50%; bottom:22px; transform:translateX(-50%); z-index:6; background:var(--label); color:var(--card); padding:9px 16px; border-radius:999px; font-weight:600; box-shadow:var(--shadow); display:flex; gap:12px; align-items:center; max-width:92%; }
.hint button { background:rgba(128,128,128,.35); color:inherit; box-shadow:none; padding:2px 10px; }
#prompts { position:absolute; left:12px; top:12px; bottom:12px; width:min(360px, calc(100% - 24px)); z-index:7; display:flex; flex-direction:column; gap:10px; overflow-y:auto; pointer-events:none; }
.prompt { pointer-events:auto; background:var(--card); border-radius:28px; padding:14px 14px 12px; box-shadow:var(--shadow); }
.prompt h3 { margin:0; font-size:1.05rem; } .prompt .sub { color:var(--secondary); font-size:.88rem; margin-bottom:8px; }
.prow { display:flex; align-items:center; gap:8px; padding:7px 0; border-top:1px solid var(--sep); flex-wrap:wrap; }
.pbtn { flex-basis:100%; display:flex; gap:6px; padding-left:32px; }
.prow .who { font-weight:600; } .prow .says { color:var(--secondary); font-size:.85rem; flex:1; min-width:6em; }
.prow .says.yes { color:var(--pos); }
.prompt .all { margin-top:8px; width:100%; padding:11px; }

/* markers sit on their point by their middle (the map anchors them by the bottom) */
.pin, .leave, .evmk, .mk, .destmk { transform:translateY(50%); }

/* car badge (CarBadge.swift: filled circle, bold rounded initial/number, white) */
.badge { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:50%; color:#fff; font:700 15px var(--badge-font); flex:none; border:2px solid transparent; }
.badge.sm { width:24px; height:24px; font-size:12px; }
.badge.phone { box-shadow:0 0 0 3px var(--label); }
.badge.joining { border:2px dashed #fff; }
.badge.offline { opacity:.4; }
.mk .badge { box-shadow:0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,.45); } .mk .badge.phone { box-shadow:0 0 0 2px #fff, 0 0 0 5px #111, 0 0 0 7px #fff, 0 2px 6px rgba(0,0,0,.45); }
.ghost .badge { background:transparent !important; border:2px dashed currentColor; box-shadow:none; opacity:.8; } 
.pin { display:flex; align-items:center; gap:5px; padding:3px 9px 3px 3px; border-radius:999px; background:var(--card); color:var(--label); font:600 12px system-ui; box-shadow:0 2px 8px rgba(0,0,0,.35); border:2px solid; white-space:nowrap; cursor:grab; }
.pin .badge { width:20px; height:20px; font-size:11px; border:0; box-shadow:none; }
.pin.fixed { cursor:default; opacity:.85; }
.leave { width:18px; height:18px; border-radius:50%; background:var(--card); border:4px solid; box-shadow:0 2px 6px rgba(0,0,0,.4); cursor:grab; }
.evmk { width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; box-shadow:0 0 0 2px var(--card), 0 2px 6px rgba(0,0,0,.4); }
.evmk.haz { background:var(--warn); } .evmk.stp { background:var(--accent); } .evmk.done { opacity:.4; }
.destmk { background:var(--label); color:var(--card); padding:3px 10px; border-radius:999px; font:600 12px system-ui; box-shadow:0 2px 8px rgba(0,0,0,.35); }

/* car cards in the panel */
.car { background:var(--card); border-radius:var(--r-tile); padding:12px; }
.car .head { display:flex; align-items:center; gap:10px; }
.car .name { font-weight:700; font-size:1rem; cursor:pointer; } .car .name .app { color:var(--secondary); font-weight:400; font-size:.8rem; }
.tag { display:inline-block; font-size:.72rem; font-weight:600; border-radius:999px; padding:1px 8px; background:var(--tile); color:var(--secondary); margin-left:4px; vertical-align:middle; }
.tag.joining { background:var(--warn-soft); color:var(--warn); } .tag.convoy { background:var(--pos-soft); color:var(--pos); } .tag.off { background:var(--red-soft); color:var(--red); }
.car .line { color:var(--secondary); font-size:.84rem; margin:4px 0 2px 42px; } .car .line.warn { color:var(--warn); font-weight:600; }
.car .ctl { display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; margin:8px 0 0 0; }
.car .pins { margin-top:8px; border-top:1px solid var(--sep); padding-top:6px; display:grid; grid-template-columns:auto 1fr; gap:5px 10px; align-items:center; }
.car .pins .pk { color:var(--secondary); font-size:.78rem; text-transform:uppercase; letter-spacing:.03em; }
.car .pins .pv { display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:.88rem; }
.car .carerr { margin:8px 0 0; }
.car .rename { display:flex; gap:6px; align-items:center; }
.feed { list-style:none; margin:0; padding:0; max-height:300px; overflow:auto; } .feed li { padding:6px 0; border-top:1px solid var(--sep); } .feed li:first-child { border-top:0; }
.feed .evt { font-size:.78rem; color:var(--secondary); }
details > summary { cursor:pointer; color:var(--secondary); font-size:.85rem; }
pre { background:var(--tile); border-radius:var(--r-control); padding:8px; max-height:240px; overflow:auto; font-size:.76rem; white-space:pre-wrap; word-break:break-all; }
.steps { margin:6px 0 10px; padding-left:1.2em; } .cand { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; border-top:1px solid var(--sep); padding:8px 0; }

/* the plain list (no map) */
.strip { position:relative; height:160px; margin:10px 8px 6px; }
.strip .road { position:absolute; left:0; right:0; top:50px; height:6px; border-radius:3px; background:var(--sep); }
.strip .ends { position:absolute; top:142px; font-size:.8rem; color:var(--secondary); } .strip .ends.r { right:0; }
.strip .dot { position:absolute; top:34px; margin-left:-13px; width:26px; height:26px; font-size:.8rem; }
.strip .name { position:absolute; font-size:.75rem; white-space:nowrap; transform:translateX(-50%); font-weight:600; }
.strip .ev { position:absolute; top:60px; transform:translateX(-50%); font-size:.85rem; line-height:1; } .strip .ev.done { opacity:.35; } .strip .ev.haz { color:var(--warn); } .strip .ev.stp { color:var(--accent); }

/* scripted demos tab */
#tabDemos { flex:1; overflow-y:auto; padding:16px; } .demos { max-width:960px; margin:0 auto; }
.seg { display:inline-flex; background:var(--tile); border-radius:999px; padding:3px; }
.seg button { box-shadow:none; background:transparent; color:var(--label); padding:4px 14px; } .seg button.on { background:var(--accent); color:var(--accent-fg); } .seg button.on.prod { background:var(--red); color:#fff; }
.banner { background:var(--warn-soft); color:var(--warn); padding:8px 12px; border-radius:var(--r-control); margin:8px 0; }
.dcard { background:var(--card); border-radius:var(--r-card); padding:16px; margin-bottom:12px; }
.bar { height:10px; border-radius:5px; background:var(--tile); overflow:hidden; margin:6px 0; } .bar i { display:block; height:100%; background:var(--accent); }
ul.tl { list-style:none; margin:8px 0 0; padding:0; }
.tl li { display:flex; gap:10px; padding:6px 8px; border-radius:var(--r-control); opacity:.55; }
.tl li.done { opacity:1; } .tl li.watch.done { background:var(--watch); } .tl li.next { opacity:1; outline:2px solid var(--accent); }
.tl .at { font-family:ui-monospace,Menlo,monospace; min-width:3.6em; } .tl .cue { font-weight:700; }
.checks { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; } .checks li { list-style:none; } .checks ul { padding:0; margin:4px 0 0; }
.pass { color:var(--pos); font-weight:600; } .fail { color:var(--red); font-weight:600; }
.dcard .code { font-size:2.4rem; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">ikut <span>demos</span></div>
  <nav class="tabs" id="tabs"><button data-tab="pg" class="on">Playground</button><button data-tab="demos">Scripted demos</button></nav>
  <div class="grow"></div>
  <div id="topStatus" class="row"></div>
</header>
<div id="notice" class="err hidden"></div>

<div id="tabPg" class="split">
  <div class="mapcol">
    <div id="map"></div>
    <div id="plain" class="hidden"></div>
    <div class="maptools hidden" id="maptools"><button data-act="fitRoute" class="sm">Whole route</button><button data-act="fitCars" class="sm">Cars</button><button data-act="follow" class="sm on" id="followBtn" title="Keep the cars in view">Follow</button></div>
    <div id="prompts"></div>
    <div id="hint" class="hint hidden"></div>
  </div>
  <aside id="panel"></aside>
</div>

<div id="tabDemos" class="hidden"><div class="demos">
  <div id="runView" class="dcard hidden"></div>
  <div class="row" style="margin-bottom:12px">
    <span>Run on</span><span class="seg" id="backendSwitch"></span>
    <button id="refresh" class="sm">Look for demos again</button>
  </div>
  <div id="prodBanner" class="banner hidden">Runs on the real Firebase project: creates a real trip and anonymous users; the trip is ended at the end.</div>
  <div id="pgOpenNote" class="note hidden">The playground is open. Close it (top right) to play a demo.</div>
  <div id="list"></div>
</div></div>

<script type="module">
import {
  decodePolyline, measure, snapToRoute, pointAtOffset, sidePoint, roadKey, placeAtCmd, endingCmd, deviateCmd, voteCmd, stoppedCmd, prepareStartsCmd, clampWait, endingOrigin,
  canMovePin, ghostOf, geometryChanges, stopPrompts, answerText, initialOf, badgeClasses, problemOwner, defaultLeaveKm, straightDeviation, fromCoord, toCoord, km1, seesStatus, framePoints, shouldRefit,
} from '/page-logic.mjs';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mmss = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const secs = (s) => (s === null || s === undefined ? '' : s < 90 ? `${s} s ago` : `${Math.round(s / 60)} min ago`);
const forcedTheme = new URLSearchParams(location.search).get('theme');
if (forcedTheme === 'light' || forcedTheme === 'dark') document.documentElement.dataset.theme = forcedTheme;
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

let demos = [], backends = {}, backend = store.get('ikut-backend') === 'production' ? 'production' : 'emulators';
let run = null, events = [], log = [], confirming = null, logOpen = false;
let pg = null, geometry = null, routeModel = null, pendingPrepare = null;
const opts = {};
const running = () => run?.status === 'running';
const pgRun = () => (run?.interactive ? run : null);
const carOf = (k) => pg?.cars?.find((c) => c.key === k);

// ---------------------------------------------------------------- tabs
let tab = location.hash === '#demos' || (location.hash !== '#playground' && store.get('ikut-tab') === 'demos') ? 'demos' : 'pg';
function showTab() {
  $('#tabPg').classList.toggle('hidden', tab !== 'pg');
  $('#tabDemos').classList.toggle('hidden', tab !== 'demos');
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  if (tab === 'pg' && gm) setTimeout(() => google.maps.event.trigger(gm.map, 'resize'), 50);
}
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { tab = b.dataset.tab; store.set('ikut-tab', tab); showTab(); } });

// ---------------------------------------------------------------- talking to the server
let lastCmd = null;
async function post(path, body) {
  let r;
  try { r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }); }
  catch { notice('The dashboard could not be reached. Is it still running?'); return false; }
  const j = await r.json().catch(() => ({}));
  notice(r.ok ? '' : (j.error || 'That did not work.'));
  return r.ok;
}
function notice(text) { $('#notice').classList.toggle('hidden', !text); $('#notice').textContent = text; }
const cmd = (body) => { lastCmd = { car: body.car ?? null, at: Date.now() }; return post('/api/command', body); };

// ---------------------------------------------------------------- Google Maps (loaded only with a key)
let gm = null, mapNote = '', config = null;
function bootstrapMaps(key) { // Google's official dynamic-import bootstrap loader
  ((g) => { var h, a, k, p = 'The Google Maps JavaScript API', c = 'google', l = 'importLibrary', q = '__ib__', m = document, b = window; b = b[c] || (b[c] = {}); var d = b.maps || (b.maps = {}), r = new Set(), e = new URLSearchParams(), u = () => h || (h = new Promise(async (f, n) => { await (a = m.createElement('script')); e.set('libraries', [...r] + ''); for (k in g) e.set(k.replace(/[A-Z]/g, (t) => '_' + t[0].toLowerCase()), g[k]); e.set('callback', c + '.maps.' + q); a.src = `https://maps.${c}apis.com/maps/api/js?` + e; d[q] = f; a.onerror = () => h = n(Error(p + ' could not load.')); a.nonce = m.querySelector('script[nonce]')?.nonce || ''; m.head.append(a); })); d[l] ? console.warn(p + ' only loads once. Ignoring:', g) : d[l] = (f, ...n) => r.add(f) && u().then(() => d[l](f, ...n)); })({ key, v: 'weekly' });
}
async function startMap() {
  try { config = await (await fetch('/api/config')).json(); } catch { config = null; }
  if (!config?.mapsKey) { mapNote = 'No Google Maps key: this is the plain list. Put GOOGLE_MAPS_API_KEY in qa/dashboard/.env and restart the dashboard to get the map.'; return renderAll(); }
  window.gm_authFailure = () => mapFailed('Google Maps did not accept the key for this address (its website restriction may not list it), so this is the plain list.');
  try {
    bootstrapMaps(config.mapsKey);
    const [{ Map }, { AdvancedMarkerElement }, { Route }] = await Promise.all([google.maps.importLibrary('maps'), google.maps.importLibrary('marker'), google.maps.importLibrary('routes')]);
    const map = new Map($('#map'), {
      center: { lat: 3.9, lng: 101.7 }, zoom: 8, mapId: config.mapId || 'DEMO_MAP_ID', colorScheme: forcedTheme === 'dark' ? google.maps.ColorScheme.DARK : forcedTheme === 'light' ? google.maps.ColorScheme.LIGHT : google.maps.ColorScheme.FOLLOW_SYSTEM,
      mapTypeControl: false, streetViewControl: false, fullscreenControl: false, clickableIcons: false, gestureHandling: 'greedy',
    });
    gm = { map, Marker: AdvancedMarkerElement, Route };
    map.addListener('dragstart', () => setFollow(false)); // the person took the map: stop following
    $('#map').addEventListener('wheel', () => setFollow(false), { passive: true });
    map.addListener('click', (e) => onMapClick({ lat: e.latLng.lat(), lng: e.latLng.lng() }));
    $('#maptools').classList.remove('hidden');
    renderAll();

function strip(st) {
  const L = st.routeLength; if (!L) return '';

  let lo = 0, hi = L;
  if (at.length) { lo = Math.max(0, Math.min(...at) - 1500); hi = Math.min(L, Math.max(...at) + 2500); if (hi - lo < 6000) { hi = Math.min(L, lo + 6000); lo = Math.max(0, hi - 6000); } }

    return `<span class="${badgeClasses(c)} dot" style="left:${pct(c.offset)};background:${c.color}" title="${esc(c.label)}">${esc(initialOf(c.label))}</span><span class="name" style="left:${pct(c.offset)};top:${top}px;color:${c.color}">${esc(c.label)}</span>`;
  }).join('');
  const evs = st.events.filter((e) => e.offset !== null && inView(e.offset)).map((e) => `<span class="ev ${e.category === 'stopRequest' ? 'stp' : 'haz'} ${e.resolved ? 'done' : ''}" style="left:${pct(e.offset)}" title="${esc(EVLABEL[e.type] || e.type)}">${e.category === 'stopRequest' ? '●' : '▲'}</span>`).join('');
  return `<div class="strip"><div class="road"></div>${dots}${evs}<span class="ends">${km1(lo)}</span><span class="ends r">${km1(hi)}</span></div>`;
}

function derive() {

  for (const e of events) {
    if (e.type === 'phase') { d.phase = e.phase; d.detail = e.detail || ''; }
    else if (e.type === 'code') d.code = e.code;
    else if (e.type === 'tick') d.tick = e;
    else if (e.type === 'backend') d.backend = e;

}

    ${d.code ? `<div><span class="cap">Trip code</span><div class="code">${esc(d.code)}</div></div>` : ''}
    ${d.errors.map((m) => `<div class="err">${esc(m)}</div>`).join('')}
    ${dur ? `<div class="row"><b>T+${mmss(t)}</b><span class="dim">of ${mmss(dur)}</span></div><div class="bar"><i style="width:${Math.min(100, t / dur * 100)}%"></i></div>` : ''}
    <ul class="tl">${run.timeline.map((e, i) => {
      const left = Math.max(0, Math.round(e.at - t));
      return `<li class="${done.has(i) ? 'done' : ''} ${e.watch ? 'watch' : ''} ${i === next ? 'next' : ''}">
        <span class="at">${mmss(e.at)}</span><span>${e.watch ? `<span class="cue">Watch${e.who && e.who !== 'script' ? ' ' + esc(e.who) : ''}:</span> ` : ''}${esc(e.text)}</span>
        ${i === next && d.phase === 'running' ? `<span class="dim" style="margin-left:auto">in ${left}s</span>` : ''}</li>`;
    }).join('')}</ul>
    ${names.length ? `<div class="checks" style="margin-top:12px">${names.map((n) => `<div><b>Phone ${esc(n)}</b><ul>${d.checks[n].map((c) =>
      `<li><span class="${c.status === 'PASS' ? 'pass' : 'fail'}">${c.status === 'PASS' ? 'PASS' : 'FAIL'}</span> ${esc(c.name)}</li>`).join('')}</ul></div>`).join('')}</div>` : ''}
    <details style="margin-top:12px" ${logOpen ? 'open' : ''}><summary>Log (last ${log.length} lines)</summary><pre id="logbox">${esc(log.join('\n'))}</pre></details>`;
  const lb = $('#logbox'); if (lb) lb.scrollTop = lb.scrollHeight;
  $('#runView details').ontoggle = (e) => { logOpen = e.target.open; };
}
function renderAll() { renderBackend(); renderList(); renderRun(); renderPanel(); syncMap(); }
async function loadDemos(refresh) {
  const j = await (await fetch('/api/demos' + (refresh ? '?refresh=1' : ''))).json();
  demos = j.demos; backends = j.backends; renderAll();
}
document.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.dataset.act) return;
  if (b.id === 'refresh') return loadDemos(true);
  if (b.dataset.b) { backend = b.dataset.b; store.set('ikut-backend', backend); confirming = null; return renderAll(); }
  if (b.dataset.stop !== undefined) return post('/api/stop');
  if (b.dataset.cancel !== undefined) { confirming = null; return renderList(); }
  if (b.dataset.play !== undefined) {
    const file = b.closest('[data-f]').dataset.f, o = opts[file];
    if (backend === 'production' && confirming !== file) { confirming = file; return renderList(); }
    confirming = null;
    post('/api/start', { file, backend, skipBuild: o.skipBuild, endTrip: backend === 'production' || o.endTrip });
  }
});
document.addEventListener('change', (ev) => { const c = ev.target.closest('[data-o]'); if (c) opts[c.closest('[data-f]').dataset.f][c.dataset.o] = c.checked; });

// ---------------------------------------------------------------- live updates
/** The server keeps a finished run's last state; the page treats it as gone: nothing from it stays on the map or in the panel. */
function dropStale() {
  pg = null; setGeometry(null); for (const k of Object.keys(carForm)) delete carForm[k];
  fittedCars = false; armed = null; renderHint();
  if (gm) clearMap();
}
function setGeometry(g) {
  geometry = g;
  routeModel = g?.route ? measure(decodePolyline(g.route)) : null;
  if (!g) fitted = false;
}
function connect() {
  const es = new EventSource('/api/events');
  es.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.k === 'snapshot') { run = msg.run; events = msg.events; log = msg.log; pg = msg.state; setGeometry(msg.geometry); confirming = null; if (run?.interactive && run.status !== 'running') dropStale(); }
    else if (msg.k === 'state') {
      pg = msg.state;
      if (pendingPrepare && pg.phase === 'setup') { const b = pendingPrepare; pendingPrepare = null; cmd(b); }
      renderPanel(); return syncMap();
    }
    else if (msg.k === 'geometry') { setGeometry(msg.geometry); renderPanel(); return syncMap(); }
    else if (msg.k === 'ev') events.push(msg.ev);
    else if (msg.k === 'log') { log.push(msg.line); if (log.length > 500) log.shift(); }
    else if (msg.k === 'run') { run = msg.run; if (run && run.status !== 'running') { pendingPrepare = null; if (run.interactive) dropStale(); } }
    if (msg.k === 'ev' || msg.k === 'log') { if (pgRun()) { const pl = $('#plog'); if (pl) { pl.textContent = log.slice(-60).join('\n'); pl.scrollTop = pl.scrollHeight; } } return renderRun(); }
    renderAll();
  };
}
setInterval(() => { if (running()) renderRun(); }, 1000);
showTab();
loadDemos().then(() => { connect(); startMap(); });
window.__ikut = { get pg() { return pg; }, get gm() { return gm; } }; // for looking at the page from the console
</script>
</body>
